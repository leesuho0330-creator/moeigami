<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="양력·음력 변환과 24절기, 공휴일, 간지, 달 모양을 한 화면에서 보는 달력">
<title>음력 달력</title>
<style>
:root {
  --bg-0: #05070f;
  --bg-1: #0a1024;
  --bg-2: #131c38;
  --ink: #eef2ff;
  --ink-2: #b7c1de;
  --ink-3: #7b86a8;
  --gold: #ffd48a;
  --gold-2: #f6b85c;
  --peri: #93a9ff;
  --mint: #93e3cf;
  --rose: #ff93a3;
  --sky: #8bb8ff;
  --glass: rgba(255, 255, 255, 0.055);
  --glass-2: rgba(255, 255, 255, 0.085);
  --line: rgba(255, 255, 255, 0.09);
  --line-2: rgba(255, 255, 255, 0.14);
  --radius: 22px;
  --shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.9), 0 2px 10px -4px rgba(0, 0, 0, 0.6);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
  margin: 0;
  padding: 0;
  background: #05070f;
}

body {
  margin: 0;
  padding: 0;
  background: transparent;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", Pretendard,
    "Noto Sans KR", "Malgun Gothic", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  font-size: 15px;
  line-height: 1.45;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}

/* ---------- 밤하늘 배경 ---------- */
.sky {
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(120% 80% at 82% -8%, rgba(147, 169, 255, 0.22) 0%, rgba(147, 169, 255, 0) 55%),
    radial-gradient(90% 60% at 12% 0%, rgba(255, 212, 138, 0.10) 0%, rgba(255, 212, 138, 0) 50%),
    radial-gradient(70% 50% at 76% 26%, rgba(103, 120, 200, 0.16) 0%, rgba(103, 120, 200, 0) 65%),
    radial-gradient(64% 48% at 20% 74%, rgba(84, 104, 176, 0.13) 0%, rgba(84, 104, 176, 0) 68%),
    radial-gradient(140% 100% at 50% 110%, rgba(40, 58, 112, 0.55) 0%, rgba(10, 16, 36, 0) 62%),
    linear-gradient(180deg, #090f20 0%, #0c142c 32%, #101b39 64%, #080c18 100%);
  overflow: hidden;
}

.moon-glow {
  position: absolute;
  top: -90px;
  right: -70px;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, rgba(255, 226, 176, 0.20) 0%, rgba(255, 212, 138, 0.07) 38%, rgba(255, 212, 138, 0) 70%);
  filter: blur(2px);
  animation: breathe 12s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.85; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.06); }
}

.stars { position: absolute; inset: 0; }

.sky::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(60% 34% at 22% 26%, rgba(147, 169, 255, 0.055) 0%, rgba(147, 169, 255, 0) 70%),
    radial-gradient(150% 100% at 50% 120%, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0) 55%);
  pointer-events: none;
}
.star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  animation: twinkle var(--dur, 5s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}
@keyframes twinkle {
  0%, 100% { opacity: var(--o, 0.5); transform: scale(1); }
  50% { opacity: calc(var(--o, 0.5) * 0.35); transform: scale(0.8); }
}

/* ---------- 레이아웃 ---------- */
.app {
  position: relative;
  width: 100%;
  max-width: 460px;
  margin: 0 auto;
  padding: calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
}

header.top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 4px 4px 14px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.brand .mark {
  width: 27px;
  height: 27px;
  flex: none;
  display: grid;
  place-items: center;
  filter: drop-shadow(0 0 9px rgba(255, 212, 138, 0.45));
}

.brand small {
  display: block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--ink-3);
  letter-spacing: 0.16em;
  margin-top: 2px;
}

.today-chip {
  text-align: right;
  font-size: 11px;
  color: var(--ink-3);
  line-height: 1.5;
  padding-top: 3px;
}
.today-chip b { color: var(--ink-2); font-weight: 600; }

/* 탭 */
.tabs {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
  padding: 4px;
  margin-bottom: 14px;
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid var(--line);
  border-radius: 16px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.tabs button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink-3);
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  padding: 7px 0;
  border-radius: 12px;
  cursor: pointer;
  transition: color 0.2s ease, background 0.25s ease, transform 0.12s ease;
}

.tabs button[aria-selected="true"] {
  color: var(--gold);
  background: linear-gradient(150deg, rgba(255, 212, 138, 0.20), rgba(255, 212, 138, 0.08));
  box-shadow: inset 0 0 0 1px rgba(255, 212, 138, 0.30), 0 6px 16px -12px rgba(255, 200, 120, 0.7);
  text-shadow: 0 0 14px rgba(255, 212, 138, 0.35);
}
.tabs button:active { transform: scale(0.98); }

/* 카드 */
.card {
  position: relative;
  background: linear-gradient(165deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.028));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px) saturate(120%);
  -webkit-backdrop-filter: blur(16px) saturate(120%);
  padding: 14px 12px;
  margin-bottom: 12px;
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0) 38%);
  opacity: 0.6;
}

/* ---------- 달력 ---------- */
.cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 2px 2px 10px;
}

.icon-btn {
  appearance: none;
  width: 40px;
  height: 40px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--glass);
  color: var(--ink-2);
  font-size: 19px;
  line-height: 1;
  cursor: pointer;
  transition: background 0.18s ease, transform 0.12s ease, border-color 0.18s ease;
}
.icon-btn:hover { background: var(--glass-2); border-color: var(--line-2); }
.icon-btn:active { transform: scale(0.94); }

.ym-btn {
  appearance: none;
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  padding: 2px 4px;
  border-radius: 14px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.ym-btn:active { background: rgba(255, 255, 255, 0.05); }

.ym {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.015em;
  display: flex;
  align-items: center;
  gap: 5px;
}
.ym .caret { font-size: 9px; color: var(--ink-3); transform: translateY(1px); }
.ym-sub { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.01em; }

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  padding: 4px 2px 6px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-3);
  text-align: center;
  letter-spacing: 0.04em;
}
.weekdays .sun { color: #ff9fae; }
.weekdays .sat { color: #93bdfd; }

.grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  padding: 0 2px;
}

.cell {
  appearance: none;
  position: relative;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink);
  border-radius: 14px;
  height: 51px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 0;
  font: inherit;
  cursor: pointer;
  transition: background 0.16s ease, transform 0.12s ease, border-color 0.16s ease;
  overflow: hidden;
}
.cell:active { transform: scale(0.95); }
.cell:hover { background: rgba(255, 255, 255, 0.05); }

.cell .sd {
  font-size: 14.5px;
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -0.02em;
}
.cell .ld {
  font-size: 9px;
  line-height: 1.1;
  color: var(--ink-3);
  letter-spacing: -0.02em;
  max-width: 100%;
  padding: 0 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cell .ev {
  font-size: 8px;
  line-height: 1.15;
  font-weight: 600;
  max-width: 100%;
  padding: 0 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -0.03em;
}

.cell.sun .sd { color: #ff9fae; }
.cell.sat .sd { color: #93bdfd; }
.cell.hol .sd { color: #ff8d9c; font-weight: 700; }
.cell.hol .ev { color: #ff8d9c; }
.cell .ev.term { color: var(--mint); }
.cell .ev.fest { color: var(--gold); }
.cell .ev.sub { color: #ffb0bb; }

.cell.empty { cursor: default; }
.cell.empty:hover { background: transparent; }
.cell.empty:active { transform: none; }

.cell.leap .ld { color: rgba(198, 184, 255, 0.85); }
.cell.other .sd { color: rgba(238, 242, 255, 0.22); }
.cell.other .ld { opacity: 0.35; }

.cell.today {
  border-color: rgba(255, 212, 138, 0.55);
  background: radial-gradient(circle at 50% 40%, rgba(255, 212, 138, 0.16), rgba(255, 212, 138, 0.02) 70%);
}
.cell.today .sd { color: var(--gold); font-weight: 700; }
.cell.today::after {
  content: "";
  position: absolute;
  bottom: 4px;
  left: 50%;
  width: 4px;
  height: 4px;
  margin-left: -2px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 8px rgba(255, 212, 138, 0.9);
}

.cell.sel {
  border-color: rgba(255, 226, 176, 0.75);
  background: linear-gradient(160deg, rgba(255, 212, 138, 0.30), rgba(147, 169, 255, 0.26));
  box-shadow: 0 8px 22px -12px rgba(255, 212, 138, 0.8);
}
.cell.sel .sd { color: #fff8e8; }
.cell.sel .ld { color: rgba(255, 248, 232, 0.8); }
.cell.sel .ev { color: #fff3d6; }
.cell.sel.today::after { background: #fff6e2; }

.cal-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 4px 2px;
}

.today-btn {
  appearance: none;
  border: 1px solid rgba(255, 212, 138, 0.35);
  background: rgba(255, 212, 138, 0.10);
  color: var(--gold);
  font: inherit;
  font-size: 12.5px;
  font-weight: 700;
  padding: 7px 15px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.18s ease, transform 0.12s ease;
  min-height: 34px;
}
.today-btn:hover { background: rgba(255, 212, 138, 0.18); }
.today-btn:active { transform: scale(0.96); }

.legend {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 10px;
  color: var(--ink-3);
}
.legend i {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 3px;
  vertical-align: 1px;
}
.legend .l-hol i { background: #ff8d9c; }
.legend .l-term i { background: var(--mint); }
.legend .l-fest i { background: var(--gold); }

/* ---------- 상세 카드 ---------- */
.detail { margin-bottom: 12px; }

.d-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 2px 4px 12px;
  border-bottom: 1px solid var(--line);
}

.d-date {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.02em;
  display: flex;
  align-items: baseline;
  gap: 7px;
  flex-wrap: wrap;
}
.d-date .wd { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.d-date .wd.sun { color: #ff9fae; }
.d-date .wd.sat { color: #93bdfd; }
.d-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.d-sub b { color: var(--gold); font-weight: 600; }

.moon-wrap { flex: none; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.moon-wrap svg { display: block; filter: drop-shadow(0 0 10px rgba(255, 226, 176, 0.45)); }
.moon-name { font-size: 9.5px; color: var(--ink-3); letter-spacing: 0.02em; }

.d-rows { display: flex; flex-direction: column; padding: 4px 2px 0; }

.row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 8px 2px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.045);
  font-size: 13px;
}
.row:last-child { border-bottom: 0; }
.row .k { flex: none; width: 44px; color: var(--ink-3); font-size: 11.5px; letter-spacing: 0.02em; }
.row .v { color: var(--ink); font-weight: 500; }
.row .v.dim { color: var(--ink-2); font-weight: 400; }
.row .v .hanja { color: var(--ink-3); font-size: 11px; margin-left: 4px; }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 999px;
  margin-right: 5px;
  line-height: 1.5;
}
.tag.hol { background: rgba(255, 147, 163, 0.14); color: #ffa8b4; border: 1px solid rgba(255, 147, 163, 0.3); }
.tag.sub { background: rgba(255, 176, 187, 0.10); color: #ffb9c3; border: 1px solid rgba(255, 176, 187, 0.24); }
.tag.term { background: rgba(147, 227, 207, 0.12); color: var(--mint); border: 1px solid rgba(147, 227, 207, 0.28); }
.tag.fest { background: rgba(255, 212, 138, 0.12); color: var(--gold); border: 1px solid rgba(255, 212, 138, 0.28); }

/* ---------- 변환기 ---------- */
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
  padding: 3px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--line);
  border-radius: 14px;
  margin-bottom: 12px;
}
.seg button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink-3);
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 9px 0;
  border-radius: 11px;
  cursor: pointer;
  min-height: 38px;
  transition: color 0.2s, background 0.25s;
}
.seg button[aria-pressed="true"] {
  color: var(--ink);
  background: rgba(255, 255, 255, 0.11);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.09);
}

.field-row {
  display: grid;
  grid-template-columns: 1.25fr 1fr 1fr;
  gap: 7px;
  margin-bottom: 9px;
}

.field {
  position: relative;
  border: 1px solid var(--line);
  background: rgba(9, 14, 30, 0.5);
  border-radius: 13px;
  padding: 7px 9px 6px;
  min-width: 0;
}
.field .lab {
  display: block;
  font-size: 9.5px;
  color: var(--ink-3);
  letter-spacing: 0.06em;
  margin-bottom: 1px;
}
.field select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 2px 16px 2px 0;
  min-height: 24px;
  cursor: pointer;
  outline: none;
}
.field select:disabled { color: var(--ink-3); }
.field .chev {
  position: absolute;
  right: 8px;
  bottom: 10px;
  font-size: 9px;
  color: var(--ink-3);
  pointer-events: none;
}
.field option { background: #101830; color: #eef2ff; }

.leap-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 2px 2px 10px;
}
.leap-row label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--ink-2);
  cursor: pointer;
  padding: 4px 0;
  min-height: 32px;
}
.leap-row input {
  appearance: none;
  width: 17px;
  height: 17px;
  border-radius: 6px;
  border: 1px solid var(--line-2);
  background: rgba(255, 255, 255, 0.06);
  cursor: pointer;
  position: relative;
  flex: none;
}
.leap-row input:checked { background: linear-gradient(140deg, #ffe6b4, var(--gold)); border-color: transparent; }
.leap-row input:checked::after {
  content: "";
  position: absolute;
  left: 5px;
  top: 1.5px;
  width: 5px;
  height: 9px;
  border: solid #2a1d05;
  border-width: 0 2px 2px 0;
  transform: rotate(42deg);
}
.leap-row input:disabled { opacity: 0.3; cursor: not-allowed; }
.leap-row .note { font-size: 10.5px; color: var(--ink-3); }

.result {
  border-radius: 18px;
  border: 1px solid rgba(255, 212, 138, 0.22);
  background: linear-gradient(160deg, rgba(255, 212, 138, 0.10), rgba(147, 169, 255, 0.07));
  padding: 14px 14px 13px;
  margin: 2px 0 4px;
}

.result .r-label { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.06em; margin-bottom: 5px; }
.result .r-main {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.3;
}
.result .r-main .small { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.result .r-meta { margin-top: 6px; font-size: 11.5px; color: var(--ink-3); }
.result .r-meta b { color: var(--ink-2); font-weight: 600; }
.result .r-warn { color: #ffb0bb; font-size: 12.5px; font-weight: 600; }

.list-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding: 14px 4px 6px;
}
.list-head h3 { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--ink-2); letter-spacing: -0.01em; }
.list-head span { font-size: 10.5px; color: var(--ink-3); }

.ylist { display: flex; flex-direction: column; gap: 1px; }
.yrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 6px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.045);
  font-size: 13px;
}
.yrow:last-child { border-bottom: 0; }
.yrow .y { color: var(--ink-3); font-size: 11.5px; width: 46px; flex: none; }
.yrow .s { font-weight: 600; letter-spacing: -0.01em; }
.yrow .s .wd { font-size: 11px; color: var(--ink-3); font-weight: 500; margin-left: 3px; }
.yrow .s .wd.sun { color: #ff9fae; }
.yrow .s .wd.sat { color: #93bdfd; }
.yrow .d { font-size: 10.5px; color: var(--ink-3); flex: none; }
.yrow .d.hit { color: var(--gold); font-weight: 700; }
.yrow.miss .s { color: var(--ink-3); font-weight: 500; }

.hint-line {
  font-size: 10.5px;
  color: var(--ink-3);
  line-height: 1.6;
  padding: 10px 4px 2px;
}

footer {
  text-align: center;
  font-size: 10px;
  color: rgba(123, 134, 168, 0.75);
  line-height: 1.7;
  padding: 14px 8px 4px;
}

/* ---------- 연·월 선택 시트 ---------- */
.sheet-back {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(3, 5, 12, 0.6);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity 0.22s ease;
}
.sheet-back.open { opacity: 1; }

.sheet {
  position: fixed;
  left: 50%;
  bottom: 0;
  z-index: 41;
  width: min(480px, 100%);
  transform: translate(-50%, 105%);
  visibility: hidden;
  transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s 0.3s;
  background: linear-gradient(180deg, #161f3d 0%, #0d1428 100%);
  border: 1px solid var(--line-2);

    } else if (k >= 0.995) {

    } else {

      if (!r.s) {
        html += "<div class='yrow miss'><span class='y'>" + r.y + "년</span>" +
          "<span class='s'>" + ref.lm + "월 " + ref.ld + "일 없음</span><span class='d'>-</span></div>";
      } else {
        var wdCls = r.wd === 0 ? "sun" : r.wd === 6 ? "sat" : "";
        var right = r.diff === 0 ? "오늘" : r.diff > 0 ? "D-" + r.diff : "D+" + (-r.diff);
        html += "<div class='yrow'><span class='y'>" + r.y + "년</span>" +
          "<span class='s'>" + r.s.m + "월 " + r.s.d + "일" +
          "<span class='wd " + wdCls + "'>" + LC.WEEKDAYS[r.wd] + "</span></span>" +
          "<span class='d" + (r.diff === 0 ? " hit" : "") + "'>" + right + "</span></div>";
      }
    });
    host.innerHTML = html;
    $("#ylistTitle").textContent = "음력 " + (ref.leap ? "윤" : "") + ref.lm + "월 " + ref.ld + "일 · 앞으로 5년";
    $("#ylistSub").textContent = ref.leap ? "윤달이 있는 해만" : (rows.length ? rows[0].y + "–" + rows[rows.length - 1].y : "");
  }

  // ---------- 이벤트 ----------
  function setSel(days) {
    state.sel = days;
    var s = LC.fromDays(days);
    if (s.m !== state.m || s.y !== state.y) { state.y = s.y; state.m = s.m; }
    renderCalendar();
    renderDetail();
  }

  function shiftMonth(delta) {
    var m = state.m + delta, y = state.y;
    if (m < 1) { m = 12; y--; }
    if (m > 12) { m = 1; y++; }
    if (y < MIN_Y || y > MAX_Y) return;
    state.y = y; state.m = m;
    renderCalendar();
  }

  $("#grid").addEventListener("click", function (e) {
    var b = e.target.closest(".cell");
    if (!b || !b.dataset.days) return;
    setSel(+b.dataset.days);
  });

  $("#prev").addEventListener("click", function () { shiftMonth(-1); });
  $("#next").addEventListener("click", function () { shiftMonth(1); });
  $("#todayBtn").addEventListener("click", function () {
    state.y = TODAY.y; state.m = TODAY.m; setSel(todayDays);
  });

  // 탭
  $$(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.view = b.dataset.view;
      $$(".tabs button").forEach(function (x) { x.setAttribute("aria-selected", x === b ? "true" : "false"); });
      $("#view-cal").hidden = state.view !== "cal";
      $("#view-conv").hidden = state.view !== "conv";
      if (state.view === "conv") renderConverter();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  // 연·월 시트
  var sheetYear = TODAY.y;
  function openSheet() {
    sheetYear = state.y;
    renderSheet();
    $("#sheetBack").hidden = false;
    requestAnimationFrame(function () {
      $("#sheetBack").classList.add("open");
      $("#sheet").classList.add("open");
    });
  }
  function closeSheet() {
    $("#sheetBack").classList.remove("open");
    $("#sheet").classList.remove("open");
    setTimeout(function () { $("#sheetBack").hidden = true; }, 300);
  }
  function renderSheet() {
    $("#sheetYear").textContent = sheetYear + "년";
    var g = $("#monthGrid");
    g.innerHTML = "";
    for (var m = 1; m <= 12; m++) {
      (function (mm) {
        var b = el("button", "", mm + "월");
        b.type = "button";
        if (sheetYear === state.y && mm === state.m) b.setAttribute("aria-pressed", "true");
        b.addEventListener("click", function () {
          state.y = sheetYear; state.m = mm;
          closeSheet();
          renderCalendar();
        });
        g.appendChild(b);
      })(m);
    }
  }
  $("#ymBtn").addEventListener("click", openSheet);
  $("#sheetBack").addEventListener("click", closeSheet);
  $("#sheetPrevY").addEventListener("click", function () { sheetYear = clamp(sheetYear - 1, MIN_Y, MAX_Y); renderSheet(); });
  $("#sheetNextY").addEventListener("click", function () { sheetYear = clamp(sheetYear + 1, MIN_Y, MAX_Y); renderSheet(); });

  // 스와이프
  (function () {
    var x0 = null, y0 = null, t0 = 0;
    var area = $("#calCard");
    area.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) return;
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
    }, { passive: true });
    area.addEventListener("touchend", function (e) {
      if (x0 === null) return;
      var t = e.changedTouches[0];
      var dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - t0;
      x0 = null;
      if (dt < 600 && Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.6) {
        shiftMonth(dx < 0 ? 1 : -1);
      }
    }, { passive: true });
  })();

  document.addEventListener("keydown", function (e) {
    if ($("#sheet").classList.contains("open") && e.key === "Escape") { closeSheet(); return; }
    if (state.view !== "cal") return;
    if (e.key === "ArrowLeft") shiftMonth(-1);
    if (e.key === "ArrowRight") shiftMonth(1);
  });

  // 변환기 이벤트
  $("#convSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    state.convMode = b.dataset.mode;
    renderConverter();
  });
  $("#cYear").addEventListener("change", function () {
    var v = +this.value;
    if (state.convMode === "s2l") {
      state.sY = v;
      state.sD = Math.min(state.sD, LC.daysInMonth(state.sY, state.sM));
    } else {
      state.lY = v;
      var leap = LC.leapMonthOf(state.lY);
      if (!leap) state.leap = false;
      else if (state.leap) state.lM = leap;
      state.lD = Math.min(state.lD, LC.monthLength(state.lY, state.lM, state.leap) || 29);
    }
    renderConverter();
  });
  $("#cMonth").addEventListener("change", function () {
    var v = this.value;
    if (state.convMode === "s2l") {
      state.sM = +v;
      state.sD = Math.min(state.sD, LC.daysInMonth(state.sY, state.sM));
    } else {
      state.lM = +v;
      if (state.leap && LC.leapMonthOf(state.lY) !== state.lM) state.leap = false;
      state.lD = Math.min(state.lD, LC.monthLength(state.lY, state.lM, state.leap) || 29);
    }
    renderConverter();
  });
  $("#cDay").addEventListener("change", function () {
    if (state.convMode === "s2l") state.sD = +this.value;
    else state.lD = +this.value;
    renderConverter();
  });
  $("#leapChk").addEventListener("change", function () {
    state.leap = this.checked;
    if (state.leap) {
      var lm = LC.leapMonthOf(state.lY);
      if (lm) state.lM = lm;
    }
    state.lD = Math.min(state.lD, LC.monthLength(state.lY, state.lM, state.leap) || 29);
    renderConverter();
  });

  // ---------- 시작 ----------
  makeStars();
  (function () {
    var host = $("#brandMark");
    if (host) host.innerHTML = moonSvg(0.34, true, 27);
  })();

  // 헤더 오늘 표시
  (function () {
    var wd = LC.WEEKDAYS[LC.weekday(todayDays)];
    $("#todayChip").innerHTML = "<b>" + LC.fmtDate(TODAY.y, TODAY.m, TODAY.d) + " " + wd + "요일</b><br>" +
      (todayLunar ? "음력 " + LC.fmtLunar(todayLunar) : "");
  })();

  renderCalendar();
  renderDetail();
  renderConverter();
})();

</script>
</body>
</html>
