 if(run.newAch&&run.newAch.length)h+='<div class="card c"><div class="sub">새 업적</div><b>'+run.newAch.join(', ')+'</b></div>';

 if(!w&&!run.revived)h+='<button class="pri wide" data-a="revive"'+(adBusy?' disabled':'')+'>광고 보고 1회 부활 (체력 50%)</button><div class="sub c">광고를 끝까지 보면 그 자리에서 체력 50%로 다시 일어나요 · 도전 1회당 한 번</div>';

function overlay(){
 if(pk){const m={up:'강화할 카드 고르기',evup:'강화할 카드 고르기',rm:'제거할 카드 고르기',evrm:'제거할 카드 고르기'}[pk];let h='<div class="card c"><div class="big">'+m+'</div></div><div class="hand">';
  run.deck.forEach((id,i)=>{const dis=(pk==='up'||pk==='evup')&&!canUp(id);h+=cardBtn(id,i,'pk',dis)});
  return '<div id="modal"><div class="in">'+h+'</div>'+(pk==='up'||pk==='rm'?'<button class="gray wide" data-a="pkx">취소</button>':'')+'</div></div>'}
 if(dk){let h='<div class="card c"><div class="big">내 덱 ('+run.deck.length+'장)</div></div><div class="hand">';
  run.deck.forEach((id,i)=>{h+=cardBtn(id,i,'none',false)});
  return '<div id="modal"><div class="in">'+h+'</div><button class="pri wide" data-a="dkx">닫기</button></div></div>'}
 return ''}
function render(){
 let h='';
 if(view==='title')h=vTitle();else if(view==='codex')h=vCodex();else if(view==='ach')h=vAch();
 else if(run.phase==='map')h=vMap();else if(run.phase==='battle')h=vBattle();else if(run.phase==='reward')h=vReward();
 else if(run.phase==='rest')h=vRest();else if(run.phase==='shop')h=vShop();else if(run.phase==='event')h=vEvent();else h=vEnd();
 const appEl=$('app');appEl.className=(view==='run'&&run&&run.phase==='battle')?'battle':'';appEl.innerHTML=h+overlay();
 document.body.style.overflow=(pk||dk)?'hidden':''}

/* ---------------- 보상형 광고 (부활 · 카드 리롤) ----------------
 * 토스 앱 안: window.abyssAds(앱인토스 SDK 브리지)로 전면형 리워드 광고를 띄우고,
 *   SDK가 보내는 userEarnedReward 이벤트에서만 보상을 준다(그냥 닫으면 지급 없음).
 * 브라우저 미리보기(SDK 없음): 광고가 없으므로 흐름 확인용으로 그대로 지급한다.
 */
function watchAd(kind,onReward){
 if(adBusy)return;
 const ads=window.abyssAds;
 const ok=!!(ads&&typeof ads.requestRewardedAd==='function'&&ads.isSupported&&ads.isSupported());
 const pay=()=>{adBusy=false;adNote='';try{onReward()}catch(err){console.error('[abyss-tower] reward failed',err)}render()};
 if(!ok){pay();return}
 adBusy=true;adNote='광고를 불러오는 중...';render();
 ads.requestRewardedAd({onReward(){if(window.abyssAnalytics)window.abyssAnalytics.log('ad_reward',{kind});pay()},
  onFail(msg){adBusy=false;adNote=msg||'광고를 볼 수 없어요. 잠시 후 다시 시도해 주세요.';render()}})}

const ACT={
 cls(i){selCls=i},asc(i){selAsc=+i},mode(i){mode=i},guide(){guide=!guide},
 /* 사망 시 1회 부활: 현재 전투를 그 자리에서 이어받아 새 턴을 시작한다 */
 revive(){if(!run||run.phase!=='dead'||run.revived)return;
  watchAd('revive',()=>{run.revived=1;run.hp=Math.max(1,Math.floor(run.mhp*.5));
   if(!run.endless&&meta.runs>0)meta.runs--;
   if(bt){bt.over=null;bt.blk=0;bt.vul=0;bt.weak=0;run.phase='battle';startTurn()}
   else{run.nodes=run.nodes||genNodes(run.floor);run.phase='map'}
   saveRun()})},
 /* 보상 화면당 1회 카드 리롤 */
 reroll(){if(!run||run.phase!=='reward'||!run.rew||run.rew.rr)return;
  watchAd('reroll',()=>{run.rew.rr=1;run.rew.cards=rcards(!!run.rew.big)})},
 codex(){view='codex'},ach(){view='ach'},back(){view='title'},
 new(){pk=null;dk=false;if(mode==='daily'){const d=todayKey();newRun(CKEYS[(+d)%4],0,d)}else newRun(selCls,selAsc,null)},
 cont(){const sv=ld(KEY,null);if(sv&&sv.run){run=sv.run;bt=sv.bt;view='run';pk=null}},
 title(){view='title';run=null;bt=null;pk=null;dk=false;saveRun()},
 endless(){run.endless=1;run.rew=null;advance()},
 go(i){const t=run.nodes[+i],f=run.floor;
  if(t==='battle')startBattle(pick(f<=4?POOLS.e:f<=8?POOLS.m:POOLS.l),'battle');
  else if(t==='elite')startBattle([pick(f>=7?['knight','shaman','golem','assas']:['knight','shaman','assas'])],'elite');
  else if(t==='boss'){if(f>12)run.boss=pick(['abyss','hydra']);startBattle([run.boss],'boss')}
  else if(t==='rest'){run.phase='rest';run.lr=run.floor}else if(t==='shop'){run.shop=genShop();run.phase='shop'}
  else if(t==='event'){const id=Math.floor(R()*EVENTS.length);run.ev={id,res:null,pend:null,cr:id===CUR_EV?shuf(CK.filter(x=>!has(x))).slice(0,2):[]};run.phase='event'}},
 sel(i){if(bt&&bt.en[+i]&&bt.en[+i].hp>0)bt.sel=+i},
 play(i){play(+i)},pot(i){usePot(+i)},end(){endTurn()},
 claim(i){i=+i;if(i>=0)addCard(run.rew.cards[i]);run.rew=null;advance()},
 rest(i){if(i==='heal'){run.hp=Math.min(run.mhp,run.hp+Math.floor(run.mhp*(T.heal+(has('mask')?.1:0))));advance()}else pk='up'},
 evo(i){const o=EVENTS[run.ev.id].o[+i];if(!o[1]())return;const r=o[2]();
  if(r==='PICKUP'){run.hp-=12;run.ev.pend='up';pk='evup'}else if(r==='PICKRM'){run.gold-=40;run.ev.pend='rm';pk='evrm'}else if(r==='REWARD'){}else run.ev.res=r},
 evdone(){advance()},
 pk(i){i=+i;
  if(pk==='up'){if(!canUp(run.deck[i]))return;run.deck[i]+='+';pk=null;advance()}
  else if(pk==='rm'){if(run.gold<run.shop.rm)return;run.gold-=run.shop.rm;run.deck.splice(i,1);run.rm++;run.shop.rm=sp(75+25*run.rm);pk=null}
  else if(pk==='evup'){if(!canUp(run.deck[i]))return;run.deck[i]+='+';run.ev.pend=null;run.ev.res='제단의 힘이 카드에 깃들었습니다.';pk=null}
  else if(pk==='evrm'){run.deck.splice(i,1);run.ev.pend=null;run.ev.res='카드를 한 장 덜어냈습니다.';pk=null}},
 pkx(){pk=null},dk(){dk=true},dkx(){dk=false},
 buy(i){const c=run.shop.cards[+i];if(c.sold||run.gold<c.p)return;run.gold-=c.p;c.sold=1;addCard(c.id)},
 bpot(){const p=run.shop.pot;if(p.sold||run.gold<p.p||run.pots.length>=slots())return;run.gold-=p.p;p.sold=1;run.pots.push(p.id)},
 rmv(){if(run.gold>=run.shop.rm&&run.deck.length>1)pk='rm'},
 sheal(){const s=run.shop;if(run.gold<s.heal||run.healed)return;run.gold-=s.heal;run.healed=1;run.hp=Math.min(run.mhp,run.hp+25)},
 leave(){run.shop=null;advance()},
